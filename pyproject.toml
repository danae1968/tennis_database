[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis"
version = "0.1.0"
description = "Shared code for the tennis analyses (serve order, birth months, match length)."
readme = "README.md"
requires-python = ">=3.10"
# pinned to match requirements.txt
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the repo root is on sys.path so tests can import analyses.<name>.<module>
pythonpath = ["."]
addopts = "--import-mode=importlib"
